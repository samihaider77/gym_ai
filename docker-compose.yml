services:
  db:
    image: postgres:15-alpine
    container_name: gym_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym_ai_password}
      POSTGRES_DB: ${POSTGRES_DB:-gym_ai_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym_ai_user} -d ${POSTGRES_DB:-gym_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gym_ai_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gym_ai_user}:${POSTGRES_PASSWORD:-gym_ai_password}@db:5432/${POSTGRES_DB:-gym_ai_db}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gym_ai_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
